name: Compilar APK

# Compila la app en la nube y publica el APK para instalarlo desde el telefono.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Primero la logica: si estas pruebas fallan, no tiene sentido seguir.
      - name: Pruebas del modulo core
        run: ./gradlew :core:test --no-daemon

      - name: Compilar el APK de depuracion
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          estado=$?
          exit $estado

      # Deja los errores de Kotlin al final del registro, faciles de leer.
      - name: Resumen de errores
        if: failure()
        shell: bash
        run: |
          echo "=================== ERRORES DE COMPILACION ==================="
          grep -E "^e: |^w: .*error|error:" /tmp/build.log | head -80 || true
          echo "=================== FIN DE ERRORES ==========================="
          grep -cE "^e: " /tmp/build.log || true

      - name: Guardar el APK como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-salud-y-fuerza-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Publica el APK con un enlace directo, para descargarlo desde el movil.
      - name: Publicar la version descargable
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK encontrado: $APK"
          cp "$APK" mi-salud-y-fuerza.apk
          gh release delete apk-ultima --yes --cleanup-tag || true
          gh release create apk-ultima mi-salud-y-fuerza.apk \
            --title "Mi Salud y Fuerza - ultima version de prueba" \
            --notes "APK de prueba compilado automaticamente desde la rama ${{ github.ref_name }}.

          Descarga \`mi-salud-y-fuerza.apk\` desde el telefono y abrelo para instalarlo.
          Android pedira permiso para instalar desde esta fuente: es normal en una app
          que no viene de Play Store.

          Commit: ${{ github.sha }}" \
            --prerelease
